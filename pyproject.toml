[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-multihop-rag"
version = "0.1.0"
description = "MultiHop-RAG retrieval and QA evaluation for Inspect AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "inspect-multihop-rag contributors" }]
keywords = ["evaluation", "rag", "retrieval", "inspect-ai", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "huggingface-hub>=0.27",
    "inspect-ai>=0.3.291",
    "rank-bm25>=0.2.2",
]

[project.entry-points.inspect_ai]
multihop_rag = "inspect_rag_multihop"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_rag_multihop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "PIE", "ISC", "N", "RUF", "PLE", "PLW"]
ignore = ["E501"]