title: "MultiHop-RAG: Benchmarking Retrieval-Augmented Generation for Multi-Hop Queries"
description: |
  MultiHop-RAG evaluates retrieval and multi-hop reasoning over a corpus of 609
  news articles. Each of the 2,556 queries requires evidence from 2-4 documents,
  and 301 queries are unanswerable. The retrieval task scores BM25 passages with
  Hits@4, Hits@10, MAP@10 and MRR@10; the QA task retrieves the top 10 passages
  and scores answer accuracy, including the unanswerable queries.
arxiv: https://arxiv.org/abs/2401.15391
